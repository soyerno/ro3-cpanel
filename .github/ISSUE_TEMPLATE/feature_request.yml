name: Feature Request
description: Suggest an idea or enhancement for RO3 CPanel
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Tell us about the feature you'd like to see.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What is your proposal?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Use Case
      description: How does this help server administrators?
