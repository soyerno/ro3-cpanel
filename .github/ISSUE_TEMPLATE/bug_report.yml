name: Bug Report
description: Create a report to help us fix an issue in RO3 CPanel
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting an issue! Please describe what happened.
  - type: input
    id: version
    attributes:
      label: RO3 CPanel / Python Version
      placeholder: e.g. Python 3.11 on Windows Server 2022
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can someone else trigger this behavior?
      placeholder: |
        1. Open CPanel in browser
        2. Attempt action ...
        3. See error ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Server / Console Logs
      description: Paste relevant log lines.
